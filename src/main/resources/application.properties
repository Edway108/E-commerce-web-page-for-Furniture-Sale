spring.application.name=${APP_NAME:furnituree}

# Railway supplies PORT at runtime. Locally this falls back to 8080.
server.port=${PORT:8080}

# Use Railway/app environment variables first, then local MySQL fallback.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/furniture_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:furnituree-secret-key-2026-demo-project-super-secure-123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}
